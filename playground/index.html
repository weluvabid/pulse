<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pulse Playground</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      body {
        max-width: 880px;
        margin: 3rem auto;
        padding: 0 1.25rem;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      .muted {
        opacity: 0.7;
      }
      .panel {
        border: 1px solid #8886;
        border-radius: 12px;
        padding: 1rem;
        margin: 1rem 0;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
      }
      button {
        padding: 0.55rem 0.85rem;
        cursor: pointer;
      }
      output {
        font:
          600 1.4rem ui-monospace,
          monospace;
      }
      #events {
        max-height: 340px;
        overflow: auto;
        padding-left: 1.5rem;
      }
      #events li {
        font:
          0.85rem/1.5 ui-monospace,
          monospace;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>Pulse Playground</h1>
    <p class="muted">
      Change a signal, watch a computed value update, and inspect the runtime event stream.
    </p>
    <section class="panel">
      <div class="row">
        <button id="decrement" type="button">−1</button>
        <button id="increment" type="button">+1</button>
        <button id="batch" type="button">Batch +1, +1</button>
        <button id="reset" type="button">Reset</button>
      </div>
      <p>Signal: <output id="count">0</output></p>
      <p>Computed (count × 2): <output id="doubled">0</output></p>
      <p>Effect executions: <output id="runs">0</output></p>
    </section>
    <section class="panel">
      <div class="row">
        <h2>Event stream</h2>
        <button id="clear" type="button">Clear</button>
      </div>
      <ol id="events" aria-live="polite"></ol>
    </section>
    <script type="module" src="./main.js"></script>
  </body>
</html>
